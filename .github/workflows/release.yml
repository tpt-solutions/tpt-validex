name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and publish wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: tpt-valid-py
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Test wheel (smoke)
        if: matrix.target == 'x86_64' && matrix.os == 'ubuntu-latest'
        run: |
          pip install tpt-valid-py/dist/*.whl pytest
          python -m pytest tpt-valid-py/tests -q
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: tpt-valid-py/dist

  publish-pypi:
    name: Publish to PyPI
    needs: [pypi, test-before-publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (version-matched)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build pkg (web + nodejs)
        run: |
          cargo build -p tpt-valid-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --out-dir tpt-valid-wasm/pkg --target web \
            target/wasm32-unknown-unknown/release/tpt_valid_wasm.wasm
      - name: Optimize wasm size (best effort)
        run: |
          if command -v wasm-opt >/dev/null; then
            wasm-opt -Oz -o tpt-valid-wasm/pkg/tpt_valid_wasm_bg.wasm \
              tpt-valid-wasm/pkg/tpt_valid_wasm_bg.wasm
          else
            echo "wasm-opt not installed; skipping (target < 5 MB already)"
          fi
      - name: Publish to npm
        working-directory: tpt-valid-wasm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Gate: run the Rust test suite before anything publishes.
  test-before-publish:
    name: Tests must pass before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The Go module publishes by tag — push matching tags on the default branch
  # (see tpt-valid-go/README.md notes about module tagging).
  dry-run-summary:
    name: Release summary
    needs: [publish-pypi, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize
        run: echo "Released ${{ github.ref_name }} to PyPI and npm."

  cli-binaries:
    name: CLI binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release -p tpt-valid-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../validex-${{ matrix.target }}.tar.gz validex
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/validex.exe `
            -DestinationPath validex-${{ matrix.target }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: validex-${{ matrix.target }}
          path: validex-${{ matrix.target }}.*
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: validex-${{ matrix.target }}.*
